<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2F5D46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trilha">
<title>Trilha — anotações em fluxo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232F5D46' d='M3 19h18L14 6l-3.5 5.5L9 9z'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#EEF1EA;
  --paper-raised:#FFFFFF;
  --ink:#1F2A22;
  --ink-soft:#5B675E;
  --line:#DBE1D5;
  --moss:#2F5D46;
  --moss-soft:#E1EEE6;
  --amber:#B8862B;
  --amber-soft:#F5E9D2;
  --audio:#45607E;
  --audio-soft:#E4EAF1;
  --image:#7C5A72;
  --image-soft:#F1E7EE;
  --danger:#B23A3A;
  --danger-soft:#FBEAEA;
  --shadow:0 1px 2px rgba(31,42,34,.06), 0 6px 16px rgba(31,42,34,.07);
  --radius:14px;
  --radius-sm:9px;
  --font-display:Georgia,'Iowan Old Style','Palatino Linotype','Book Antiqua',serif;
  --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
}
[data-theme="dark"]{
  --paper:#161A17;
  --paper-raised:#1F2420;
  --ink:#E8ECE5;
  --ink-soft:#98A395;
  --line:#2B322C;
  --moss:#7FBE9B;
  --moss-soft:#22322A;
  --amber:#E0B15C;
  --amber-soft:#332A18;
  --audio:#8FB0D6;
  --audio-soft:#212B36;
  --image:#D2A9C4;
  --image-soft:#332632;
  --danger:#E08080;
  --danger-soft:#3A2323;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-tap-highlight-color:transparent;
}
button,input,textarea{font:inherit;color:inherit;}
button{-webkit-appearance:none;appearance:none;}
img,video{max-width:100%;display:block;}
body.modal-open{overflow:hidden;}

#app{display:flex;flex-direction:column;min-height:100%;}

/* Topbar */
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;
  background:color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:19px;font-weight:700;}
.brand svg{width:22px;height:22px;color:var(--moss);flex-shrink:0;}
.topbar-actions{display:flex;gap:2px;}
.icon-btn{
  width:38px;height:38px;border-radius:10px;border:none;background:none;
  color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.icon-btn svg{width:19px;height:19px;}
.icon-btn:hover{background:var(--paper-raised);color:var(--ink);box-shadow:0 0 0 1px var(--line);}

/* Breadcrumb / trilha */
.breadcrumb{
  display:flex;align-items:center;overflow-x:auto;
  padding:10px 16px 8px;
  scrollbar-width:none;
}
.breadcrumb::-webkit-scrollbar{display:none;}
.crumb{
  display:flex;align-items:center;gap:6px;background:none;border:none;
  font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);
  white-space:nowrap;cursor:pointer;padding:4px 2px;flex-shrink:0;
}
.crumb-dot{width:7px;height:7px;border-radius:50%;background:var(--line);box-shadow:0 0 0 1px var(--line);flex-shrink:0;}
.crumb--active .crumb-dot{background:var(--moss);box-shadow:0 0 0 3px var(--moss-soft);}
.crumb--active .crumb-label{color:var(--ink);font-weight:700;}
.crumb-label{max-width:140px;overflow:hidden;text-overflow:ellipsis;}
.crumb-line{width:16px;height:1px;background:repeating-linear-gradient(to right, var(--line) 0 4px, transparent 4px 7px);margin:0 3px;flex-shrink:0;}

/* Main */
.main{max-width:640px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;}
.node-content{padding:14px 14px 0;}
.node-children{padding:6px 14px 110px;}
.section-heading{font-family:var(--font-display);text-align: center; font-size:19px;margin:16px 4px 10px;font-weight:700;}

.empty-state{text-align:center;color:var(--ink-soft);padding:34px 18px;font-size:14px;line-height:1.6;}

/* Content card (current node) */
.content-card{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
.content-card.is-conclusion{border-color:var(--amber);}
.content-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;}
.content-headtext{flex:1;min-width:0;}
.content-title{font-family:var(--font-display);font-size:15px;margin:0 0 4px;word-break:break-word;line-height:1.25;}
.content-meta{font-family:var(--font-mono);font-size:10px;color:var(--ink-soft);}
.badge{display:inline-flex;align-items:center;}
.badge svg{width:14px;height:14px;}
.badge--star,.badge--flag{color:var(--amber);}
.badge--count{background:var(--moss-soft);color:var(--moss);font-family:var(--font-mono);font-size:10.5px;padding:2px 7px;border-radius:20px;}
.badge--lg{background:var(--amber-soft);margin-top: 4px; color:var(--amber);padding:5px 11px;border-radius:20px;font-size:12px;display:inline-flex;gap:5px;align-items:center;font-weight:700;flex-shrink:0;}
.content-audio{width:100%;margin:8px 0;}
.content-image{width:100%;border-radius:12px;display:block;margin:8px 0;max-height:440px;object-fit:contain;background:var(--paper);}
/* --- Textos e Códigos --- */
.text-block-wrapper { position: relative; margin: 12px 0 0; }
.content-text {
  white-space: pre;
  word-wrap: break-word;
  font-family: var(--font-mono); /* Deixa com cara de código */
  background: var(--paper);
  padding: 30px 14px 14px 14px; /* Espaço extra no topo para o botão */
  border-radius: 10px;
  border: 1px solid var(--line);
  line-height: 1.6;
  font-size: 14px;
  margin: 0;
  overflow: auto;
  max-height: 190px;
}
.content-text--empty {
  font-family: var(--font-body);
  background: transparent;
  border: none;
  padding: 0;
  color: var(--ink-soft);
  font-style: italic;
  text-align: center;
}
.btn-copy {
    position: absolute;
    top: 2px;
    left: 6px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 5px 5px;
    border-radius: 6px;
    font-size: 9px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
}
.btn-copy svg { width: 12px; height: 12px; }
.btn-copy:hover { color: var(--moss); border-color: var(--moss); }
.content-caption{color:var(--ink-soft);font-size:13.5px;font-style:italic;margin:8px 0 0;}
.content-actions{display:flex;justify-content: center;flex-wrap:wrap;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);}

/* Cards (children list) */
.card{
  display:flex;align-items:stretch;background:var(--paper-raised);
  border:1px solid var(--line);border-radius:var(--radius);margin-bottom:9px;
  overflow:hidden;box-shadow:var(--shadow);transition:transform .1s ease;
}
.card:active{transform:scale(.99);}
.card--conclusion{border-color:var(--amber);}
.card-body{
  flex:1;display:flex;align-items:center;gap:12px;padding:12px 13px;
  background:none;border:none;text-align:left;cursor:pointer;min-width:0;
}
.card-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.card-icon svg{width:17px;height:17px;}
.card-icon--text{background:var(--moss-soft);color:var(--moss);}
.card-icon--audio{background:var(--audio-soft);color:var(--audio);}
.card-icon--image{background:var(--image-soft);color:var(--image);}
.card-icon--link { background: var(--paper); color: var(--ink-soft); border: 1px dashed var(--line); }
.card-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.card-title{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-preview{font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-badges{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.card-menu{
  width:38px;border:none;background:none;color:var(--ink-soft);cursor:pointer;
  display:flex;align-items:center;justify-content:center;border-left:1px solid var(--line);flex-shrink:0;
}
.card-menu svg{width:16px;height:16px;}
.card-menu:hover{color:var(--ink);background:var(--paper);}

/* FAB */
.fab{
  position:fixed;left:30px;bottom:50px;width:56px;height:56px;border-radius:50%;
  background:var(--moss);color:#fff;border:none;box-shadow:0 8px 22px rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:40;
}
.fab svg{width:24px;height:24px;}
.fab:active{transform:scale(.94);}
.fab-menu{
  position:fixed;left: 70px;bottom:100px;background:var(--paper-raised);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:1px;
  z-index:41;min-width:210px;
}
.fab-menu button{
  display:flex;align-items:center;gap:11px;padding:11px 12px;border:none;background:none;
  text-align:left;border-radius:9px;font-size:14px;cursor:pointer;
}
.fab-menu button svg{width:17px;height:17px;color:var(--ink-soft);flex-shrink:0;}
.fab-menu button:hover{background:var(--paper);}

/* Popover (card menu) */
.popover{
  position:fixed;background:var(--paper-raised);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);padding:6px;min-width:210px;z-index:70;display:flex;flex-direction:column;
}
.popover button{
  display:flex;align-items:center;gap:10px;text-align:left;padding:9px 10px;border:none;
  background:none;border-radius:8px;font-size:13.5px;cursor:pointer;
}
.popover button svg{width:15px;height:15px;color:var(--ink-soft);flex-shrink:0;}
.popover button:hover{background:var(--paper);}
.popover-danger{color:var(--danger) !important;}
.popover-danger svg{color:var(--danger) !important;}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,20,16,.46);display:flex;align-items:flex-end;justify-content:center;z-index:60;}
@media (min-width:720px){.modal-overlay{align-items:center;}}
.modal{
  background:var(--paper-raised);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
  border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.2);
  animation:slideUp .18s ease;
}
@media (min-width:720px){.modal{border-radius:18px;animation:popIn .15s ease;}}
.modal--large{max-width:680px;}
.modal--small{max-width:420px;}
.modal-header{
  display:flex;align-items:center;justify-content:space-between;padding:16px 18px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper-raised);z-index:2;
}
#modalTitle{font-family:var(--font-display);font-size:18px;margin:0;font-weight:700;}
.modal-body{padding: 18px 18px 60px 18px;}
.modal-actions{display:flex;justify-content:flex-start;gap:10px;margin-top:8px;flex-wrap:wrap;}
.modal-actions--wrap{justify-content:space-between;}
@keyframes slideUp{from{transform:translateY(28px);opacity:.5;}to{transform:translateY(0);opacity:1;}}
@keyframes popIn{from{transform:scale(.96);opacity:0;}to{transform:scale(1);opacity:1;}}

/* Forms */
.field{display:block;margin-bottom:14px;}
.field span{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;font-weight:700;}
.field input,.field textarea{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  font-size:14.5px;background:var(--paper);color:var(--ink);resize:vertical;
}
.field input:focus,.field textarea:focus{outline:2px solid var(--moss);outline-offset:1px;border-color:var(--moss);}
.hint{color:var(--ink-soft);font-size:13px;line-height:1.55;}
.confirm-text{font-size:14.5px;line-height:1.6;margin-bottom:4px;}

/* Buttons */
.btn{
  font-size:13.8px;font-weight:700;padding:10px 15px;border-radius:10px;border:1px solid transparent;
  cursor:pointer;display:inline-flex;align-items:center;gap:6px;
}
.btn svg{width:15px;height:15px;}
.btn-primary{background:var(--moss);color:#fff;}
.btn-primary:hover{filter:brightness(1.06);}
.btn-ghost{background:none;border-color:var(--line);}
.btn-ghost:hover{background:var(--paper);}
.btn-danger{color:var(--danger);}
.btn-danger.btn-ghost:hover{background:var(--danger-soft);border-color:var(--danger);}
.btn-small{padding:6px 10px;font-size:12.5px;border-radius:8px;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}
.btn-record{background:var(--danger);color:#fff;}
.btn-record--active{animation:pulse 1.3s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(178,58,58,.45);}50%{box-shadow:0 0 0 8px rgba(178,58,58,0);}}

/* Recorder / Camera */
.recorder{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0 10px;}
.recorder-time{font-family:var(--font-mono);font-size:30px;letter-spacing:1px;}
.camera-wrap{display:flex;flex-direction:column;gap:10px;}
.camera-wrap video,.camera-wrap img{width:100%;border-radius:12px;background:#000;max-height:56vh;object-fit:cover;}

/* Library / search */
.lib-toolbar{position:sticky;top:0;background:var(--paper-raised);padding-bottom:10px;margin-bottom:10px;display:flex;flex-direction:column;gap:10px;z-index:2;}
#libQuery{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14.5px;background:var(--paper);color:var(--ink);}
.lib-filters{display:flex;gap:6px;flex-wrap:wrap;}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;
  border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);font-size:12.5px;cursor:pointer;
}
.chip svg{width:12px;height:12px;}
.chip--active{background:var(--moss-soft);border-color:var(--moss);color:var(--moss);font-weight:700;}
.lib-results{display:flex;flex-direction:column;gap:8px;max-height: 280px;overflow-y: scroll;}
.lib-item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--paper);}
.lib-item-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.lib-item-title{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px;}
.lib-item-title svg{width:12px;height:12px;color:var(--amber);flex-shrink:0;}
.lib-item-path{font-size:11.5px;color:var(--ink-soft);}
.lib-item-actions{display:flex;gap:6px;flex-shrink:0;}

/* Settings */
.settings-list{display:flex;flex-direction:column;gap:6px;}
.settings-item{
  display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);
  border-radius:12px;background:var(--paper);font-size:14.5px;cursor:pointer;text-align:left;width:100%;
}
.settings-item svg{width:18px;height:18px;flex-shrink:0;color:var(--ink-soft);}
.settings-item:hover{border-color:var(--moss);}
.settings-item--danger{color:var(--danger);}
.settings-item--danger svg{color:var(--danger);}
.settings-item--danger:hover{border-color:var(--danger);background:var(--danger-soft);}

/* Media preview in edit modal */
.media-preview{margin-bottom:14px;}
.media-preview img{width:100%;border-radius:10px;}
.media-preview audio{width:100%;}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);
  background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:13.5px;
  opacity:0;transition:opacity .2s ease,transform .2s ease;z-index:85;max-width:88vw;text-align:center;
  box-shadow:var(--shadow);pointer-events:none;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* Progress overlay */
.progress-overlay{position:fixed;inset:0;background:rgba(15,20,16,.46);display:flex;align-items:center;justify-content:center;z-index:90;}
.progress-box{background:var(--paper-raised);padding:26px 30px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:var(--shadow);max-width:80vw;text-align:center;}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--moss);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
}
[hidden] {
  display: none !important;
}
.breadcrumb {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;

    z-index: 69;

    display: flex;
    align-items: center;
    overflow-x: auto;

    padding: 10px 16px 15px;

    background: var(--paper-raised);
    border-top: 1px solid var(--line-hair);

    scrollbar-width: none;
    box-shadow: var(--shadow);
}
/* --- Estilos do Orçamento --- */
.budget-check-wrap { display: flex; align-items: center; padding: 0 0 0 14px; }
.budget-check {
  -webkit-appearance: none; appearance: none;
  width: 22px; height: 22px; margin: 0;
  border: 2px solid var(--line); border-radius: 6px;
  background: var(--paper); cursor: pointer; position: relative;
}
.budget-check:checked { background: var(--moss); border-color: var(--moss); }
.budget-check:checked::after {
  content: ''; position: absolute; top: 3px; left: 7px;
  width: 4px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
.total-budget-box {
  background: var(--moss-soft); padding: 18px; border-radius: 12px; margin-top: 10px;
  text-align: center; color: var(--moss);
}
.total-budget-box h4 { margin: 0 0 6px; font-size: 14px; color: var(--ink-soft); }
.total-budget-box .val { font-size: 28px; font-weight: 700; font-family: var(--font-display); }
.total-budget-box .sub { font-size: 13.5px; margin-top: 8px; font-weight: bold; opacity: 0.8; }
#nodeList{
    border-radius:3%;
    overflow-y:auto;
    max-height:244px;
}
/* --- Estilos do Speedrun (LiveSplit Mode) --- */
.speedrun-active { 
  width: auto !important; padding: 0 12px !important; gap: 6px;
  font-family: var(--font-mono); font-weight: bold; font-size: 14px;
  animation: pulseSR 1.5s infinite; transition: all 0.3s ease;
}
.speedrun-active.sr-neutral { background: var(--audio-soft) !important; color: var(--audio) !important; box-shadow: 0 0 0 1px var(--audio) !important; }
.speedrun-active.sr-ahead { background: var(--moss-soft) !important; color: var(--moss) !important; box-shadow: 0 0 0 1px var(--moss) !important; }
.speedrun-active.sr-behind { background: var(--danger-soft) !important; color: var(--danger) !important; box-shadow: 0 0 0 1px var(--danger) !important; }

@keyframes pulseSR { 0%, 100% { opacity: 1; } 50% { opacity: 0.75; } }
.sr-list-wrap { 
  max-height: 280px; overflow-y: auto; margin-top: 8px; 
  border: 1px solid var(--line); border-radius: 8px; background: var(--paper); 
}
.sr-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.sr-item:last-child { border-bottom: none; }
.sr-item-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 10px; }
.sr-item-time { font-family: var(--font-mono); font-weight: bold; flex-shrink: 0; }

/* Blocos de Diferença (Split) */
.sr-diff { font-family: var(--font-mono); font-size: 15px; font-weight: bold; margin-top: 6px; display: inline-block; padding: 6px 12px; border-radius: 8px; }
.sr-diff.ahead { background: #E1EEE6; color: #2F5D46; } /* Verde */
.sr-diff.behind { background: #FBEAEA; color: #B23A3A; } /* Vermelho */

/* Splits pequenos da Lista */
.split-badge { padding: 3px 6px; font-size: 11px; border-radius: 5px; margin-left: 6px; font-weight: bold; font-family: var(--font-mono); min-width: 48px; text-align: center; }
.split-badge.gold { background: #F5E9D2; color: #B8862B; box-shadow: 0 0 0 1px #E0B15C; } /* Ouro (Novo melhor tempo da etapa) */
</style>
</head>
<body>
<noscript>Este aplicativo precisa de JavaScript habilitado para funcionar.</noscript>

<div id="app">
  <header class="topbar">
    <div class="brand">

/* =======================================================================
   BANCO DE DADOS (IndexedDB)
======================================================================= */
const DB_NAME = 'trilhaDB';
const DB_VERSION = 1;
const STORE = 'nodes';
const ROOT = 'root'; // chave usada para itens de nível superior (IndexedDB não indexa null)

let dbPromise = null;
function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains(STORE)){
        const store = db.createObjectStore(STORE, {keyPath:'id'});
        store.createIndex('parentId','parentId',{unique:false});
      }
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
  return dbPromise;
}
function reqToPromise(req){
  return new Promise((resolve,reject)=>{
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function storeTx(mode){
  const db = await openDB();
  return db.transaction(STORE, mode).objectStore(STORE);
}
async function dbPut(node){ const s = await storeTx('readwrite'); return reqToPromise(s.put(node)); }
async function dbGet(id){ if(!id) return null; const s = await storeTx('readonly'); return reqToPromise(s.get(id)); }
async function dbDelete(id){ const s = await storeTx('readwrite'); return reqToPromise(s.delete(id)); }
async function dbChildren(parentId){ const s = await storeTx('readonly'); return reqToPromise(s.index('parentId').getAll(parentId)); }
async function dbChildCount(parentId){ const s = await storeTx('readonly'); return reqToPromise(s.index('parentId').count(parentId)); }
async function dbClearAll(){ const s = await storeTx('readwrite'); return reqToPromise(s.clear()); }
async function dbCursorAll(callback){
  const s = await storeTx('readonly');
  return new Promise((resolve,reject)=>{
    const req = s.openCursor();
    req.onsuccess = (e)=>{
      const cur = e.target.result;
      if(cur){ callback(cur.value); cur.continue(); } else resolve();
    };
    req.onerror = ()=>reject(req.error);
  });
}
async function countAll(){ let c=0; await dbCursorAll(()=>c++); return c; }
async function countDescendants(id){
  let count=0, queue=[id];
  while(queue.length){
    const next=[];
    for(const pid of queue){
      const kids = await dbChildren(pid);
      count += kids.length;
      for(const k of kids) next.push(k.id);
    }
    queue = next;
  }
  return count;
}
async function deleteNodeCascade(id){
  const toDelete = [id];
  let queue = [id];
  while(queue.length){
    const next = [];
    for(const pid of queue){
      const kids = await dbChildren(pid);
      for(const k of kids){ toDelete.push(k.id); next.push(k.id); }
    }
    queue = next;
  }
  const s = await storeTx('readwrite');
  await Promise.all(toDelete.map(nid => reqToPromise(s.delete(nid))));
  return toDelete.length;
}

/* =======================================================================
   UTILITÁRIOS
======================================================================= */
function uuid(){
  if(window.crypto && typeof crypto.randomUUID === 'function'){
    try{ return crypto.randomUUID(); }catch(e){ /* segue para o fallback */ }
  }
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
    const r = Math.random()*16|0, v = c==='x' ? r : (r&0x3|0x8);
    return v.toString(16);
  });
}
function escapeHTML(s){
  return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function debounce(fn, ms){
  let t;
  return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), ms); };
}
function formatDate(ts){
  if(!ts) return '';
  try{
    return new Date(ts).toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  }catch(e){ return ''; }
}
function formatTime(totalSeconds){
  const m = Math.floor(totalSeconds/60).toString().padStart(2,'0');
  const s = (totalSeconds%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}
function displayTitle(node){
  if(node.title && node.title.trim()) return node.title.trim();
  if(node.type==='text') return (node.text||'').slice(0,44) || 'Sem título';
  if(node.type==='audio') return 'Gravação de áudio';
  if(node.type==='image') return 'Imagem';
  if(node.type==='link') return 'Atalho';
  return 'Sem título';
}
function previewText(node){
  if(node.type==='text') return (node.text||'').slice(0,90);
  if(node.type==='audio') return node.text || 'Toque para ouvir';
  if(node.type==='image') return node.text || 'Toque para ver';
  return '';
}
function blobToDataURL(blob){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}
function dataURLToBlob(dataUrl){ return fetch(dataUrl).then(r=>r.blob()); }

/* =======================================================================
   ESTADO / NAVEGAÇÃO
======================================================================= */
let currentNodeId = null;   // null = início
let currentNode = null;
let breadcrumbPath = [];    // [{id,title}, ...] do início até o nó atual (sem o "Início")

async function buildPath(node){
  const path = [{id:node.id, title:displayTitle(node)}];
  let parentId = node.parentId;
  while(parentId && parentId !== ROOT){
    const p = await dbGet(parentId);
    if(!p) break;
    path.unshift({id:p.id, title:displayTitle(p)});
    parentId = p.parentId;
  }
  return path;
}

async function goTo(nodeId){
  if(nodeId === '' ) nodeId = null;

  // --- MÁGICA DO SPEEDRUN: Marca o tempo gasto na etapa que você acabou de ler ---
  if(typeof srActive !== 'undefined' && srActive){
    const tempoGasto = Math.floor((Date.now() - srNodeStart) / 1000);
    const tituloPasso = currentNode ? displayTitle(currentNode) : 'Início';
    if (tempoGasto > 0) srHistory.push({ title: tituloPasso, time: tempoGasto });
    srNodeStart = Date.now(); // Zera o relógio interno para o próximo passo
  }
  // -------------------------------------------------------------------------------

  if(nodeId === null){
    currentNodeId = null; currentNode = null; breadcrumbPath = [];
  } else {
    const n = await dbGet(nodeId);
    if(!n){
      currentNodeId = null; currentNode = null; breadcrumbPath = [];
      toast('Este item não existe mais.');
      return render();
    }
    currentNodeId = nodeId; currentNode = n;
    breadcrumbPath = await buildPath(n);
  }
  render();
}

async function createNode({type, title='', text='', mediaBlob=null, mediaMime=null, favorite=false, isConclusion=false, targetId=null}){
  const now = Date.now();
  const node = {
    id: uuid(),
    parentId: currentNodeId===null ? ROOT : currentNodeId,
    type, title, text,
    mediaBlob: mediaBlob || undefined,
    mediaMime: mediaMime || undefined,
    targetId: targetId || undefined, // <- NOVA LINHA: Guarda o endereço do portal
    isConclusion: !!isConclusion,
    favorite: !!favorite,
    order: now,
    createdAt: now,
    updatedAt: now
  };
  await dbPut(node);
  return node;
}

async function moveNode(id, dir){
  const node = await dbGet(id);
  if(!node) return;
  const kids = await dbChildren(node.parentId);
  kids.sort((a,b)=>(a.order||0)-(b.order||0));
  const idx = kids.findIndex(k=>k.id===id);
  const swapIdx = dir==='up' ? idx-1 : idx+1;
  if(swapIdx<0 || swapIdx>=kids.length) return;
  const other = kids[swapIdx];
  const tmp = node.order; node.order = other.order; other.order = tmp;
  await dbPut(node); await dbPut(other);
  render();
}

/* =======================================================================
   RENDERIZAÇÃO
======================================================================= */
const elBreadcrumb = document.getElementById('breadcrumb');
const elContent = document.getElementById('nodeContent');
const elChildrenHeading = document.getElementById('childrenHeading');
const elList = document.getElementById('nodeList');
const elEmpty = document.getElementById('emptyState');

let activeObjectURLs = [];
function revokeActiveURLs(){ activeObjectURLs.forEach(u=>URL.revokeObjectURL(u)); activeObjectURLs = []; }
function trackURL(blob){ const u = URL.createObjectURL(blob); activeObjectURLs.push(u); return u; }

async function render(){
  renderBreadcrumb();
  await renderContent();
  await renderChildren();
}

function renderBreadcrumb(){
  const items = [{id:null, title:'Início'}, ...breadcrumbPath];
  elBreadcrumb.innerHTML = items.map((it,idx)=>{
    const isLast = idx === items.length-1;
    return `<button type="button" class="crumb ${isLast?'crumb--active':''}" data-crumb="${it.id===null?'':escapeHTML(it.id)}">`+
      `<span class="crumb-dot"></span><span class="crumb-label">${escapeHTML(it.title)}</span></button>`+
      (!isLast ? '<span class="crumb-line"></span>' : '');
  }).join('');
  elBreadcrumb.querySelectorAll('[data-crumb]').forEach(b=>{
    b.onclick = ()=> goTo(b.dataset.crumb || null);
  });
  requestAnimationFrame(()=>{ elBreadcrumb.scrollLeft = elBreadcrumb.scrollWidth; });
}

async function renderContent(){
  revokeActiveURLs();
  if(currentNodeId === null){
    elContent.hidden = true;
    elContent.innerHTML = '';
    elChildrenHeading.textContent = 'Minhas trilhas';
    return;
  }
  const n = currentNode;
  elContent.hidden = false;
  let mediaHTML = '';
  if(n.type==='audio' && n.mediaBlob){
    mediaHTML = `<audio controls src="${trackURL(n.mediaBlob)}" class="content-audio"></audio>`;
  } else if(n.type==='image' && n.mediaBlob){
    mediaHTML = `<img src="${trackURL(n.mediaBlob)}" class="content-image" alt="">`;
  }
  const bodyText = n.type==='text'
    ? (n.text && n.text.trim()
        ? `<div class="text-block-wrapper">
             <button type="button" class="btn-copy" id="btnCopyText" title="Copiar texto">
               <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
               Copiar
             </button>
             <pre class="content-text">${escapeHTML(n.text)}</pre>
           </div>`
        : `<p class="content-text content-text--empty">Sem anotação adicional.</p>`)
    : (n.text && n.text.trim() ? `<p class="content-caption">${escapeHTML(n.text)}</p>` : '');

  // Verifica se a anotação atual tem valor de dinheiro (Orçamento)
  const valTitle = extractValue(n.title);
  const valText = extractValue(n.text);
  const isBudget = (valTitle > 0 || valText > 0);

  elContent.innerHTML = `
    <div class="content-card ${n.isConclusion?'is-conclusion':''}">
      <div class="content-head">
        <span class="card-icon card-icon--${n.type}">${icon(n.type)}</span>
        <div class="content-headtext">
          <span class="content-meta">${formatDate(n.createdAt)}${(n.updatedAt && n.updatedAt!==n.createdAt) ? ' · editado '+formatDate(n.updatedAt) : ''}</span>
          <h1 class="content-title">${escapeHTML(displayTitle(n))}</h1>
          
        </div>
        
      </div>
      ${mediaHTML}
      ${bodyText}
      ${n.isConclusion ? `<span class="badge badge--lg">${icon('flag')} Etapa Conclusiva</span>` : ''}
      <div class="content-actions">
        
        <div class= "alinhar">
            <button type="button" class="btn btn-ghost" id="caEdit">${icon('edit')} Editar</button>
            <button type="button" class="btn btn-ghost" id="caFlag">${icon('flag')} ${n.isConclusion?'Etapa':'Conclusão?'}</button>
            <button type="button" class="btn btn-ghost" id="caFav" title="${n.favorite ? 'Remover favorito' : 'Favoritar'}" style="padding: 10px; ${n.favorite ? 'color: var(--amber);' : ''}">
          ${icon('star').replace('fill="none"', n.favorite ? 'fill="currentColor"' : 'fill="none"')}
        </button>
        </div>
        <div class="alinhar2">
        
        <!-- Novo botão de Voltar -->
        <button type="button" class="btn btn-ghost" id="caBack">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Voltar
        </button>
        <!-- Nova caixinha de Concluído (só aparece se for orçamento) -->
        ${isBudget ? `
        <label class="btn btn-ghost" style="cursor:pointer; display:inline-flex; align-items:center; gap:8px;">
          <input type="checkbox" id="caBudget" class="budget-check" style="margin:0; width:18px; height:18px; min-height:18px;" ${n.isBudgetDone ? 'checked' : ''}> 
          Executado
        </label>` : ''}
        <button type="button" class="btn btn-ghost" id="caExport">${icon('download')} </button>
        <button type="button" class="btn btn-ghost btn-danger" id="caDelete">${icon('trash')} </button>
        </div>
      </div>
    </div>`;
  elChildrenHeading.textContent = 'Próximos passos';

  // Lógica do botão de voltar
  document.getElementById('caBack').onclick = () => {
    goTo(n.parentId === ROOT ? null : n.parentId);
  };

  // Lógica da caixinha de marcação
  if(isBudget) {
    document.getElementById('caBudget').onchange = async (e) => {
      n.isBudgetDone = e.target.checked;
      n.updatedAt = Date.now();
      await dbPut(n);
      // Ao marcar aqui, automaticamente vai atualizar no cálculo total!
    };
  }

  // Lógicas antigas que já funcionavam
  document.getElementById('caExport').onclick = () => exportSingleFlow(n.id);
  document.getElementById('caEdit').onclick = ()=>openEditModal(n);
  document.getElementById('caFav').onclick = async ()=>{ n.favorite=!n.favorite; n.updatedAt=Date.now(); await dbPut(n); render(); };
  document.getElementById('caFlag').onclick = async ()=>{ n.isConclusion=!n.isConclusion; n.updatedAt=Date.now(); await dbPut(n); render(); };
  // Lógica de copiar texto/código
  const copyBtn = document.getElementById('btnCopyText');
  if (copyBtn) {
    copyBtn.onclick = async () => {
      try {
        await navigator.clipboard.writeText(n.text);
        const originalHTML = copyBtn.innerHTML;
        // Muda o visual para "Copiado!" com um ícone de check
        copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Copiado!`;
        copyBtn.style.color = 'var(--moss)';
        copyBtn.style.borderColor = 'var(--moss)';
        
        // Volta ao normal depois de 2 segundos
        setTimeout(() => {
          copyBtn.innerHTML = originalHTML;
          copyBtn.style.color = '';
          copyBtn.style.borderColor = '';
        }, 2000);
      } catch (err) {
        toast('Erro ao copiar o texto.');
      }
    };
  }
  document.getElementById('caDelete').onclick = async ()=>{
    const count = await countDescendants(n.id);
    const msg = count>0
      ? `Isso vai excluir este item e mais ${count} item(ns) dentro dele. Essa ação não pode ser desfeita.`
      : 'Excluir este item? Essa ação não pode ser desfeita.';
    const ok = await confirmDialog(msg, 'Excluir', true);
    if(ok){
      const parentId = n.parentId;
      await deleteNodeCascade(n.id);
      await goTo(parentId===ROOT ? null : parentId);
      toast('Item excluído.');
    }
  };
}

async function renderChildren(){

  // Aumenta a lista apenas na tela inicial
  if(currentNodeId === null){
    elList.style.maxHeight = "65vh";
  }else{
    elList.style.maxHeight = "244px";
  }

  const parentKey = currentNodeId===null ? ROOT : currentNodeId;
  const kids = await dbChildren(parentKey);

  kids.sort((a,b)=>(a.order||0)-(b.order||0));

  elList.innerHTML = '';

  if(!kids.length){

    elEmpty.hidden = false;

    elEmpty.textContent = currentNodeId===null
      ? 'Nenhuma trilha ainda. Toque em + para começar.'
      : 'Nenhum próximo passo ainda. Toque em + para continuar a trilha, ou marque esta etapa como conclusão.';

    return;
  }

  elEmpty.hidden = true;

  const counts = await Promise.all(
    kids.map(k => dbChildCount(k.id))
  );

  kids.forEach((node,i)=>
    elList.appendChild(createCardEl(node, counts[i]))
  );

}

function createCardEl(node, count){
  const card = document.createElement('div');
  card.className = 'card' + (node.isConclusion ? ' card--conclusion' : '');

/* =======================================================================
   MENU DE CONTEXTO DO CARTÃO (popover)
======================================================================= */
let openMenuEl = null;
function closeCardMenu(){
  if(openMenuEl){ openMenuEl.remove(); openMenuEl = null; }
  document.removeEventListener('click', closeCardMenuOutside);
  window.removeEventListener('scroll', closeCardMenu, true);
}
function closeCardMenuOutside(e){ if(openMenuEl && !openMenuEl.contains(e.target)) closeCardMenu(); }

async function openCardMenu(id, anchor){
  closeCardMenu();
  const node = await dbGet(id);
  if(!node) return;
  const menu = document.createElement('div');
  menu.className = 'popover';
  menu.innerHTML = `
    <button type="button" data-a="edit">${icon('edit')} Editar</button>
    <button type="button" data-a="fav">${icon('star')} ${node.favorite?'Remover favorito':'Favoritar'}</button>
    <button type="button" data-a="flag">${icon('flag')} ${node.isConclusion?'Desmarcar conclusão':'Marcar conclusão'}</button>
    <button type="button" data-a="export">${icon('download')} Exportar Trilha</button>
    <button type="button" data-a="up">↑ Mover para cima</button>
    <button type="button" data-a="down">↓ Mover para baixo</button>
    <button type="button" data-a="del" class="popover-danger">${icon('trash')} Excluir</button>
  `;
  document.body.appendChild(menu);
  const r = anchor.getBoundingClientRect();
  const top = Math.min(r.bottom + 6, window.innerHeight - menu.offsetHeight - 8);
  let left = r.right - menu.offsetWidth;
  if(left < 8) left = 8;
  menu.style.top = top + 'px';
  menu.style.left = left + 'px';
  openMenuEl = menu;
  setTimeout(()=>{
    document.addEventListener('click', closeCardMenuOutside);
    window.addEventListener('scroll', closeCardMenu, true);
  }, 0);

  menu.onclick = async (e)=>{
    const btn = e.target.closest('button');
    if(!btn) return;
    const a = btn.dataset.a;
    closeCardMenu();
    if(a==='edit') openEditModal(node);
    else if(a==='fav'){ node.favorite=!node.favorite; node.updatedAt=Date.now(); await dbPut(node); render(); }
    else if(a==='flag'){ node.isConclusion=!node.isConclusion; node.updatedAt=Date.now(); await dbPut(node); render(); }
    else if(a==='export') exportSingleFlow(id); // <-- Adicione esta linha
    else if(a==='up') moveNode(id,'up');
    else if(a==='down') moveNode(id,'down');
    else if(a==='del'){
      const count = await countDescendants(id);
      const msg = count>0
        ? `Isso vai excluir este item e mais ${count} item(ns) dentro dele. Essa ação não pode ser desfeita.`
        : 'Excluir este item? Essa ação não pode ser desfeita.';
      const ok = await confirmDialog(msg, 'Excluir', true);
      if(ok){ await deleteNodeCascade(id); render(); toast('Item excluído.'); }
    }
  };
}

const overlay = document.getElementById('modalOverlay');
const modalBox = document.getElementById('modalBox');
const modalTitleEl = document.getElementById('modalTitle');
const modalBodyEl = document.getElementById('modalBody');
let modalCleanup = null;

function openModal({title, bodyHTML, className='', onMount, onClose}){
  modalTitleEl.textContent = title;
  modalBodyEl.innerHTML = bodyHTML;
  modalBox.className = 'modal' + (className ? ' '+className : '');
  overlay.hidden = false;
  document.body.classList.add('modal-open');
  modalCleanup = onClose || null;
  if(onMount) onMount(modalBodyEl);
}
function closeModal(){
  overlay.hidden = true;
  document.body.classList.remove('modal-open');
  modalBodyEl.innerHTML = '';
  const cleanup = modalCleanup;
  modalCleanup = null;
  if(cleanup){ try{ cleanup(); }catch(e){ console.error(e); } }
}
document.getElementById('modalClose').innerHTML = icon('close');
document.getElementById('modalClose').onclick = closeModal;
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !overlay.hidden) closeModal(); });

function confirmDialog(message, confirmLabel='Confirmar', danger=false){
  return new Promise(resolve=>{
    openModal({
      title:'Confirmar',
      className:'modal--small',
      bodyHTML:`
        <p class="confirm-text">${escapeHTML(message)}</p>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="cNo">Cancelar</button>
          <button type="button" class="btn ${danger?'btn-danger btn-ghost':'btn-primary'}" id="cYes">${escapeHTML(confirmLabel)}</button>
        </div>`,
      onMount:(body)=>{
        body.querySelector('#cNo').onclick = ()=>{ resolve(false); closeModal(); };
        body.querySelector('#cYes').onclick = ()=>{ resolve(true); closeModal(); };
      },
      onClose: ()=> resolve(false)
    });
  });
}

/* =======================================================================

======================================================================= */
let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.hidden = false;
  requestAnimationFrame(()=> el.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{
    el.classList.remove('show');
    setTimeout(()=>{ el.hidden = true; }, 220);
  }, 2600);
}

function showProgress(msg){
  let el = document.getElementById('progressOverlay');
  if(!el){
    el = document.createElement('div');
    el.id = 'progressOverlay';
    el.className = 'progress-overlay';
    el.innerHTML = `<div class="progress-box"><div class="spinner"></div><p id="progressMsg"></p></div>`;
    document.body.appendChild(el);
  }
  el.querySelector('#progressMsg').textContent = msg;
  el.hidden = false;
  return {
    update: (m)=>{ el.querySelector('#progressMsg').textContent = m; },
    close: ()=>{ el.hidden = true; }
  };
}

/* =======================================================================
   ÁUDIO — gravação
======================================================================= */
let audioStream = null, audioRecorder = null, audioChunks = [], audioTimer = null, audioSeconds = 0;

function pickAudioMime(){
  const options = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'];
  for(const o of options){
    if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(o)) return o;
  }
  return '';
}
function stopAudioCapture(){
  if(audioRecorder && audioRecorder.state !== 'inactive'){ try{ audioRecorder.stop(); }catch(e){} }
  if(audioStream){ audioStream.getTracks().forEach(t=>t.stop()); audioStream = null; }
  clearInterval(audioTimer);
  audioRecorder = null;
}

function openAudioModal(){
  audioChunks = []; audioSeconds = 0;
  let recordedBlob = null;
  openModal({
    title:'Gravar áudio',
    bodyHTML:`
      <div class="recorder">
        <div class="recorder-time" id="recTime">00:00</div>
        <button type="button" id="recToggle" class="btn btn-record">${icon('mic')} Gravar</button>
        <audio id="recPreview" controls hidden style="width:100%;margin-top:6px"></audio>
        <p id="recFallbackMsg" class="hint" hidden>Não foi possível acessar o microfone pelo navegador. Use o botão abaixo para gravar pelo app nativo do aparelho.</p>
        <label class="btn btn-ghost" id="recFallbackBtn" hidden style="display:none;cursor:pointer;">
          ${icon('mic')} Gravar com o app do aparelho
          <input type="file" accept="audio/*" capture id="recFallbackInput" hidden>
        </label>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="recCancel">Cancelar</button>
        <button type="button" class="btn btn-primary" id="recSave" disabled>${icon('check')} Usar áudio</button>
      </div>`,
    onClose: stopAudioCapture,
    onMount:(body)=>{
      const toggleBtn = body.querySelector('#recToggle');
      const timeEl = body.querySelector('#recTime');
      const preview = body.querySelector('#recPreview');
      const saveBtn = body.querySelector('#recSave');
      const fallbackMsg = body.querySelector('#recFallbackMsg');
      const fallbackBtn = body.querySelector('#recFallbackBtn');
      const fallbackInput = body.querySelector('#recFallbackInput');

      body.querySelector('#recCancel').onclick = closeModal;

      toggleBtn.onclick = async ()=>{
        if(!audioRecorder || audioRecorder.state==='inactive'){
          try{
            audioStream = await navigator.mediaDevices.getUserMedia({audio:true});
          }catch(err){
            fallbackMsg.hidden = false;
            fallbackBtn.hidden = false; fallbackBtn.style.display='inline-flex';
            toggleBtn.disabled = true;
            return;
          }
          const mime = pickAudioMime();
          audioRecorder = mime ? new MediaRecorder(audioStream, {mimeType:mime}) : new MediaRecorder(audioStream);
          audioChunks = [];
          audioRecorder.ondataavailable = (e)=>{ if(e.data && e.data.size>0) audioChunks.push(e.data); };
          audioRecorder.onstop = ()=>{
            recordedBlob = new Blob(audioChunks, {type: audioRecorder.mimeType || 'audio/webm'});
            preview.src = URL.createObjectURL(recordedBlob);
            preview.hidden = false;
            saveBtn.disabled = false;
            clearInterval(audioTimer);
          };
          audioRecorder.start();
          audioSeconds = 0; timeEl.textContent = '00:00';
          audioTimer = setInterval(()=>{ audioSeconds++; timeEl.textContent = formatTime(audioSeconds); }, 1000);
          toggleBtn.innerHTML = `${icon('mic')} Parar`;
          toggleBtn.classList.add('btn-record--active');
          preview.hidden = true; saveBtn.disabled = true;
        } else {
          audioRecorder.stop();
          if(audioStream) audioStream.getTracks().forEach(t=>t.stop());
          toggleBtn.innerHTML = `${icon('mic')} Gravar novamente`;
          toggleBtn.classList.remove('btn-record--active');
        }
      };

      fallbackInput.onchange = ()=>{
        const file = fallbackInput.files[0];
        if(file){
          recordedBlob = file;
          preview.src = URL.createObjectURL(file);
          preview.hidden = false;
          saveBtn.disabled = false;
        }
      };

      saveBtn.onclick = async ()=>{
        if(!recordedBlob) return;
        await createNode({type:'audio', mediaBlob:recordedBlob, mediaMime: recordedBlob.type || 'audio/webm'});
        closeModal();
        render();
        toast('Áudio adicionado.');
      };
    }
  });
}

function openCameraModal(){

      const fallbackBtn = body.querySelector('#camFallbackBtn');

        navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}})
          .then(stream=>{ cameraStream = stream; video.srcObject = stream; })
          .catch(()=>{
            video.hidden = true; fallbackMsg.hidden = false;
            fallbackBtn.hidden = false; fallbackBtn.style.display='inline-flex';
            shutterBtn.hidden = true;
          });
      } else {
        video.hidden = true; fallbackMsg.hidden = false;
        fallbackBtn.hidden = false; fallbackBtn.style.display='inline-flex';
        shutterBtn.hidden = true;
      }

      shutterBtn.onclick = ()=>{
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob=>{
          if(!blob) return;
          captured = blob;
          previewImg.src = URL.createObjectURL(blob);
          previewImg.hidden = false; video.hidden = true;
          shutterBtn.hidden = true; useBtn.hidden = false; retakeBtn.hidden = false;
        }, 'image/jpeg', 0.86);
      };
      retakeBtn.onclick = ()=>{
        captured = null; previewImg.hidden = true; video.hidden = false;
        shutterBtn.hidden = false; useBtn.hidden = true; retakeBtn.hidden = true;
      };
      fallbackInput.onchange = ()=>{
        const file = fallbackInput.files[0];
        if(file){ captured = file; saveCaptured(); }
      };
      useBtn.onclick = saveCaptured;

      async function saveCaptured(){
        if(!captured) return;
        await createNode({type:'image', mediaBlob:captured, mediaMime: captured.type || 'image/jpeg'});

        render();
        toast('Foto adicionada.');
      }
    }
  });
}

   BIBLIOTECA (busca + reaproveitamento de qualquer item já criado)
======================================================================= */
function openLibraryModal(opts={}){
  openModal({
    title:'Biblioteca',
    className:'modal--large',
    bodyHTML:`
      <div class="lib-toolbar">
        <input type="search" id="libQuery" placeholder="Buscar por título ou texto...">
        <div class="lib-filters">
          <button type="button" class="chip chip--active" data-type="all">Tudo</button>
          <button type="button" class="chip" data-type="text">${icon('text')} Texto</button>
          <button type="button" class="chip" data-type="audio">${icon('audio')} Áudio</button>
          <button type="button" class="chip" data-type="image">${icon('image')} Imagem</button>
          <button type="button" class="chip" data-fav="1">${icon('star')} Favoritos</button>
        </div>
      </div>
      <div id="libResults" class="lib-results"><p class="hint">Carregando…</p></div>`,
    onMount:(body)=>{
      let typeFilter = 'all';
      let favOnly = !!opts.favOnly;
      let queryText = '';
      const resultsEl = body.querySelector('#libResults');
      const chips = Array.from(body.querySelectorAll('.chip'));
      const queryInput = body.querySelector('#libQuery');

      if(favOnly){
        chips.forEach(c=>{ if(c.dataset.fav) c.classList.add('chip--active'); });
      }

      queryInput.oninput = debounce((e)=>{ queryText = e.target.value.trim().toLowerCase(); refresh(); }, 220);

      chips.forEach(chip=>{
        chip.onclick = ()=>{
          if(chip.dataset.fav){
            favOnly = !favOnly;
            chip.classList.toggle('chip--active', favOnly);
          } else {
            typeFilter = chip.dataset.type;
            chips.forEach(c=>{ if(!c.dataset.fav) c.classList.remove('chip--active'); });
            chip.classList.add('chip--active');
          }
          refresh();
        };
      });

      async function refresh(){
        resultsEl.innerHTML = '<p class="hint">Buscando…</p>';
        const matches = [];
        await dbCursorAll(node=>{
          if(matches.length >= 200) return;
          if(typeFilter!=='all' && node.type!==typeFilter) return;
          if(favOnly && !node.favorite) return;
          if(queryText){
            const hay = ((node.title||'')+' '+(node.text||'')).toLowerCase();
            if(!hay.includes(queryText)) return;
          }
          matches.push(node);
        });
        matches.sort((a,b)=> (b.updatedAt||0) - (a.updatedAt||0));
        await renderLibResults(matches, resultsEl);
      }
      if(opts.focusSearch){ setTimeout(()=>queryInput.focus(), 60); }
      refresh();
    }
  });
}

async function renderLibResults(matches, container){
  if(!matches.length){ container.innerHTML = '<p class="hint">Nada encontrado.</p>'; return; }
  container.innerHTML = '';
  
  for(const node of matches){
    const parent = (node.parentId===ROOT || !node.parentId) ? null : await dbGet(node.parentId);
    const parentLabel = parent ? displayTitle(parent) : 'Início';
    const row = document.createElement('div');
    row.className = 'lib-item';
    row.style.padding = '0'; // Tira o padding do container para colocar no botão interno
    
    row.innerHTML = `
      <!-- ÁREA CLICÁVEL PRINCIPAL (Navega para o item) -->
      <button type="button" class="lib-item-body" data-goto="${node.id}" style="display:flex; align-items:center; gap:10px; flex:1; min-width:0; background:none; border:none; text-align:left; padding:10px; cursor:pointer;">
        <span class="card-icon card-icon--${node.type}">${icon(node.type)}</span>
        <span class="lib-item-text">
          <span class="lib-item-title">${escapeHTML(displayTitle(node))}${node.isConclusion?icon('flag'):''}</span>
          <span class="lib-item-path">Em: ${escapeHTML(parentLabel)}</span>
        </span>
      </button>
      
      <!-- AÇÕES EXTRAS AO LADO -->
      <span class="lib-item-actions" style="padding-right: 10px;">
        <button type="button" class="btn btn-small btn-primary" data-link="${node.id}">Atalho</button>
        <button type="button" class="btn btn-small btn-ghost" data-insert="${node.id}">Cópia</button>
      </span>`;
      
    container.appendChild(row);
  }
  
  container.onclick = async (e)=>{
    const gotoBtn = e.target.closest('[data-goto]');
    const linkBtn = e.target.closest('[data-link]');
    const insertBtn = e.target.closest('[data-insert]');
    
    // Ação Principal: Clicou no corpo do item -> Navega direto pra lá!
    if(gotoBtn){
      closeModal();
      await goTo(gotoBtn.dataset.goto);
      return;
    }
    
    // Ação: Cria apenas um portal apontando para a tela original
    if(linkBtn){
      const src = await dbGet(linkBtn.dataset.link);
      if(src){
        await createNode({type:'link', title: src.title, targetId: src.id});
        toast('Atalho criado na trilha atual.');
        closeModal();
        render();
      }
    }
    
    // Ação: Cria uma cópia (clone) idêntica
    if(insertBtn){
      const src = await dbGet(insertBtn.dataset.insert);
      if(src){

/* --------- Exportar Trilha Específica (Isolada) --------- */
async function exportSingleFlow(startNodeId) {
  closeCardMenu();
  const progress = showProgress('Preparando exportação da trilha…');
  try {
    const nodesToExport = [];
    const startNode = await dbGet(startNodeId);
    if(!startNode) { progress.close(); return; }

    // O nó inicial vira "ROOT" (Raiz) no arquivo exportado. 
    // Assim, quem importar isso vai ver esse item direto na tela Início.
    const rootClone = { ...startNode, parentId: ROOT };
    nodesToExport.push(rootClone);

    // Varre infinitamente pegando todos os filhos e ramificações desse nó
    let queue = [startNodeId];
    while(queue.length > 0) {
      const next = [];
      for(const pid of queue) {
        const kids = await dbChildren(pid);
        for(const k of kids) {
          nodesToExport.push(k);
          next.push(k.id);
        }
      }
      queue = next;
    }

    const out = [];
    for(let i=0; i<nodesToExport.length; i++){
      const n = nodesToExport[i];
      const item = {
        id:n.id, parentId:n.parentId, type:n.type, title:n.title||'', text:n.text||'',
        isConclusion:!!n.isConclusion, favorite:!!n.favorite, order:n.order,
        createdAt:n.createdAt, updatedAt:n.updatedAt,
        targetId: n.targetId || undefined,
        isBudgetDone: !!n.isBudgetDone,
        mediaMime: n.mediaMime || null, mediaDataUrl: null
      };
      if(n.mediaBlob){ item.mediaDataUrl = await blobToDataURL(n.mediaBlob); }
      out.push(item);
      if(i % 15 === 0) progress.update(`Exportando… ${i+1}/${nodesToExport.length}`);
    }

    const payload = { app:'trilha-notas', version:1, exportedAt:new Date().toISOString(), nodes:out };
    const json = JSON.stringify(payload);
    const blob = new Blob([json], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    
    // Cria um nome de arquivo inteligente baseado no título do Fluxo
    const stamp = new Date().toISOString().slice(0,10);
    const safeName = (startNode.title || 'trilha').replace(/[^a-z0-9]/gi, '_').toLowerCase();
    
    a.href = url; a.download = `${safeName}-${stamp}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    progress.close();
    toast(`Trilha exportada: ${out.length} etapa(s).`);
  } catch(err) {
    progress.close();
    console.error(err);
    toast('Erro ao exportar. Veja o console.');
  }
}

const fileImportEl = document.getElementById('fileImport');
fileImportEl.onchange = async ()=>{
  const file = fileImportEl.files[0];
  fileImportEl.value = '';
  if(!file) return;
  const progress = showProgress('Lendo arquivo…');
  let payload;
  try{
    const text = await file.text();
    payload = JSON.parse(text);
    if(!payload || !Array.isArray(payload.nodes)) throw new Error('Formato inválido');
  }catch(err){
    progress.close();
    console.error(err);
    toast('Erro ao importar: arquivo inválido.');
    return;
  }
  progress.close();

  const mode = await importModeDialog(payload.nodes.length);
  if(mode==='cancel') return;

  const progress2 = showProgress('Importando…');
  try{
    if(mode==='replace'){ await dbClearAll(); }
    
    // 1. Cria os novos IDs (RGs novos) para não misturar com o que já existe
    const idMap = new Map();
    for(const n of payload.nodes) idMap.set(n.id, uuid());
    
    let i = 0;
    for(const n of payload.nodes){
      const newId = mode==='replace' ? n.id : idMap.get(n.id);
      
      // 2. Atualiza quem é o "Pai" da anotação
      let parentId;
      if(!n.parentId || n.parentId===ROOT){ parentId = ROOT; }
      else if(idMap.has(n.parentId)){ parentId = mode==='replace' ? n.parentId : idMap.get(n.parentId); }
      else { parentId = ROOT; }

      // 3. A MÁGICA DOS ATALHOS AQUI: Atualiza o destino do link!
      let targetId = n.targetId || undefined;
      if (mode === 'merge' && targetId && idMap.has(targetId)) {
        targetId = idMap.get(targetId); // Traduz pro novo RG!
      }
      
      const rec = {
        id:newId, parentId, type:n.type, title:n.title||'', text:n.text||'',
        isConclusion:!!n.isConclusion, favorite:!!n.favorite,
        order:n.order || Date.now(), createdAt:n.createdAt || Date.now(), updatedAt:n.updatedAt || Date.now(),
        targetId: targetId, // <- Salva o link corrigido
        isBudgetDone: !!n.isBudgetDone,
        mediaMime: n.mediaMime || undefined, mediaBlob: undefined
      };
      
      if(n.mediaDataUrl){ rec.mediaBlob = await dataURLToBlob(n.mediaDataUrl); }
      await dbPut(rec);
      
      i++;
      if(i % 20 === 0) progress2.update(`Importando… ${i}/${payload.nodes.length}`);
    }
    
    progress2.close();
    currentNodeId = null; currentNode = null; breadcrumbPath = [];
    render();
    toast(`Importado: ${i} item(ns).`);
  }catch(err){
    progress2.close();
    console.error(err);
    toast('Erro durante a importação. Veja o console para detalhes.');
  }
};

// Agora ele busca o valor salvo; se for a primeira vez, usa R$ 120,00
let VALOR_HORA = parseFloat(localStorage.getItem('trilha-valor-hora')) || 120;

function extractValue(text) {
  if(!text) return 0;
  let total = 0;
  
  // 1. Procura dinheiro na anotação (ex: R$ 150,00)
  let matchMoney = text.match(/R\$\s*(\d{1,3}(?:\.\d{3})*(?:,\d{2})?|\d+(?:,\d{2})?)/i);
  if(!matchMoney) matchMoney = text.match(/\b(\d{1,3}(?:\.\d{3})*,\d{2})\b/);
  if(matchMoney) {
    const numStr = matchMoney[1].replace(/\./g, '').replace(',', '.');
    total += parseFloat(numStr) || 0;
  }
  
  // 2. Procura tempo de mão de obra (ex: 30m, 2h, 1.5h, 90min)
  const regexTime = /\b(\d+(?:[.,]\d+)?)\s*(h|m|min|hora|horas)\b/gi;
  let matchTime;
  while ((matchTime = regexTime.exec(text)) !== null) {
    const num = parseFloat(matchTime[1].replace(',', '.'));
    const unit = matchTime[2].toLowerCase();
    
    if (unit === 'h' || unit.startsWith('hora')) {
      total += num * VALOR_HORA;
    } else if (unit === 'm' || unit.startsWith('min')) {
      total += (num / 60) * VALOR_HORA;
    }
  }
  return total;
}

async function getFlowNodes() {
  let nodes = [];
  if (currentNodeId === null || breadcrumbPath.length === 0) {
    await dbCursorAll(n => nodes.push(n));
  } else {
    const rootFlowId = breadcrumbPath[0].id;
    const baseNode = await dbGet(rootFlowId);
    if (baseNode) nodes.push(baseNode);

    let queue = [rootFlowId];
    while (queue.length > 0) {
      const next = [];
      for (const pid of queue) {
        const kids = await dbChildren(pid);
        for (const k of kids) {
          nodes.push(k);
          next.push(k.id);
        }
      }
      queue = next;
    }
  }
  return nodes;
}

async function getRouteNodes() {
  const nodes = [];
  if (breadcrumbPath && breadcrumbPath.length > 0) {
    for (const b of breadcrumbPath) {
      const n = await dbGet(b.id);
      if (n) nodes.push(n);
    }
  }
  return nodes;
}

let srNodeStart = 0;
let srTimer = null;
let srTotalSeconds = 0;
let srCurrentRecord = null; // PB
let srSoB = 0; // Sum of Best

const btnSpeedrun = document.getElementById('btnSpeedrun');
btnSpeedrun.innerHTML = icon('clock');

function formatSRTime(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60).toString().padStart(2, '0');
  const s = (sec % 60).toString().padStart(2, '0');
  if (h > 0) return `${h}:${m}:${s}`;
  return `${m}:${s}`;
}

btnSpeedrun.onclick = async () => {
  // === INICIAR SPEEDRUN ===
  if (!srActive) {
    if (currentNodeId === null || breadcrumbPath.length === 0) {
      toast('Entre em um fluxo primeiro para iniciar o tempo.');
      return;
    }
    
    srRootId = breadcrumbPath[0].id; 
    const rootNode = await dbGet(srRootId);
    srCurrentRecord = rootNode.speedrunRecord || null;
    const bestSegments = rootNode.bestSegments || {};
    const pbRoute = rootNode.pbRoute || [];
    
    srSoB = 0;
    if (pbRoute.length > 0) {
      srSoB = pbRoute.reduce((sum, title) => sum + (bestSegments[title] || 0), 0);
    }
    
    srActive = true;
    srHistory = [];
    srNodeStart = Date.now();
    srTotalSeconds = 0;

    btnSpeedrun.classList.add('speedrun-active');
    btnSpeedrun.classList.remove('sr-ahead', 'sr-behind', 'sr-neutral');
    
    let recordDisplay = '';
    if (srCurrentRecord) {
      btnSpeedrun.classList.add('sr-ahead');
      // Reduzimos o tamanho e o espaçamento para caber as horas sem estourar a tela do celular
      recordDisplay = `<span style="font-size:9.5px; opacity:0.85; font-weight:normal; margin-left:4px; border-left:1px solid currentColor; padding-left:4px; line-height:1.2;">
        PB:${formatSRTime(srCurrentRecord)}<br>SB:${formatSRTime(srSoB)}
      </span>`;
    } else {
      btnSpeedrun.classList.add('sr-neutral');
    }

    // A fonte do relógio foi para 14px e compactada (letter-spacing)
    btnSpeedrun.innerHTML = `<div style="display:flex; align-items:center;">${icon('clock')} <span id="srClockText" style="margin-left:4px; font-size:14px; letter-spacing:-0.5px;">00:00</span> ${recordDisplay}</div>`;

    srTimer = setInterval(() => {
      // A MÁGICA CONTRA BLOQUEIO DE TELA: Em vez de somar +1, ele lê o relógio do sistema!
      const pastTime = srHistory.reduce((acc, curr) => acc + curr.time, 0);
      const currentStepTime = Math.floor((Date.now() - srNodeStart) / 1000);
      srTotalSeconds = pastTime + currentStepTime;
      
      const t = document.getElementById('srClockText');
      if (t) t.textContent = formatSRTime(srTotalSeconds);
      
      if (srCurrentRecord) {
        if (srTotalSeconds > srCurrentRecord && btnSpeedrun.classList.contains('sr-ahead')) {
          btnSpeedrun.classList.remove('sr-ahead');
          btnSpeedrun.classList.add('sr-behind');
        }
      }
    }, 1000);
    
    toast('🚀 Speedrun Iniciado! Valendo!');
  } 
  // === FINALIZAR E COMPARAR (MODAL) ===
  else {
    clearInterval(srTimer);
    srActive = false;
    
    btnSpeedrun.classList.remove('speedrun-active', 'sr-ahead', 'sr-behind', 'sr-neutral');
    btnSpeedrun.innerHTML = icon('clock');

    const tempoGasto = Math.floor((Date.now() - srNodeStart) / 1000);
    const tituloPasso = currentNode ? displayTitle(currentNode) : 'Fim do Fluxo';
    if (tempoGasto > 0) srHistory.push({ title: tituloPasso, time: tempoGasto });

    const totalTempo = srHistory.reduce((acc, curr) => acc + curr.time, 0);

    const rootNode = await dbGet(srRootId);
    let recordTime = rootNode.speedrunRecord || null;
    let bestSegments = rootNode.bestSegments || {};
    let recordMsg = '';
    let diffHtml = '';
    let isNewRecord = false;
    
    // 1. ANÁLISE ETAPA POR ETAPA (Golds e Red Splits)
    let htmlList = '';
    srHistory.forEach(h => {
      const previousBest = bestSegments[h.title];
      let diffBadge = '';
      let timeColor = 'var(--ink)';
      let prevText = '';

      if (!previousBest) {
        bestSegments[h.title] = h.time;
        diffBadge = `<span class="split-badge gold">Ouro!</span>`;
        timeColor = 'var(--moss)';
      } else {
        const diff = h.time - previousBest;
        prevText = `<span style="font-size:11px; color:var(--ink-soft); margin-right:8px;">Ant: ${formatSRTime(previousBest)}</span>`;
        
        if (diff < 0) {
          bestSegments[h.title] = h.time; // Bateu o tempo da etapa (Gold Split!)
          diffBadge = `<span class="split-badge ahead">-${formatSRTime(Math.abs(diff))}</span>`;
          timeColor = 'var(--moss)';
        } else if (diff > 0) {
          diffBadge = `<span class="split-badge behind">+${formatSRTime(diff)}</span>`;
          timeColor = 'var(--danger)';
        } else {
          diffBadge = `<span class="split-badge" style="background:var(--paper); border:1px solid var(--line); color:var(--ink-soft);">=</span>`;
        }
      }
      
      htmlList += `
        <div class="sr-item">
          <span class="sr-item-title" title="${escapeHTML(h.title)}">${escapeHTML(h.title)}</span>
          <div style="display:flex; align-items:center; flex-shrink:0;">
            ${prevText}
            <span class="sr-item-time" style="color:${timeColor}">${formatSRTime(h.time)}</span>
            ${diffBadge}
          </div>
        </div>
      `;
    });

    // 2. ANÁLISE GERAL DO RECORDE (PB)
    if (!recordTime || totalTempo < recordTime) {
      rootNode.speedrunRecord = totalTempo;
      rootNode.pbRoute = srHistory.map(h => h.title); // Salva a rota vitoriosa para o próximo SoB!
      isNewRecord = true;
      if (!recordTime) {
        recordMsg = 'Tempo Base Registrado.';
      } else {
        recordMsg = `🎉 NOVO RECORDE! (O anterior era ${formatSRTime(recordTime)})`;
        diffHtml = `<div class="sr-diff ahead">↓ -${formatSRTime(Math.abs(totalTempo - recordTime))} mais rápido!</div>`;
      }
    } else {
      const diff = totalTempo - recordTime;
      if (totalTempo > recordTime) {
        recordMsg = `O Recorde (PB) continua sendo ${formatSRTime(recordTime)}`;
        diffHtml = `<div class="sr-diff behind">↑ +${formatSRTime(diff)} mais lento</div>`;
      } else {
        recordMsg = `Empatou com o recorde de ${formatSRTime(recordTime)}!`;
        diffHtml = `<div class="sr-diff" style="background:var(--paper); border:1px solid var(--line);">Empate cravado</div>`;
      }
    }

    // Salva tudo no banco
    rootNode.bestSegments = bestSegments;
    await dbPut(rootNode);

    openModal({
      title: 'Resultados (LiveSplit Mode)',
      bodyHTML: `
        <div class="total-budget-box" style="padding:16px; background: ${isNewRecord ? 'var(--moss-soft)' : 'var(--paper-raised)'}; border: 1px solid ${isNewRecord ? 'var(--moss)' : 'var(--line)'};">
          <h4 style="margin:0 0 6px; font-size:12px; text-transform:uppercase; color: ${isNewRecord ? 'var(--moss)' : 'var(--ink-soft)'};">SEU TEMPO FINAL</h4>
          <div class="val" style="font-size:36px; color: ${isNewRecord ? 'var(--moss)' : 'var(--ink)'};">${formatSRTime(totalTempo)}</div>
          ${diffHtml}
          <div class="sub" style="font-size:12px; margin-top:10px;">${recordMsg}</div>
        </div>
        <div style="margin-top:18px;">
          <span style="font-size:11.5px; font-weight:bold; color:var(--ink-soft);">ANÁLISE DE ETAPAS:</span>
          <div class="sr-list-wrap">${htmlList || '<p class="hint" style="padding:10px;">Nenhum passo registrado.</p>'}</div>
        </div>
        <div class="modal-actions" style="margin-top:20px; justify-content:space-between;">
          <button type="button" class="btn btn-ghost btn-danger" id="bResetSR">${icon('trash')} Apagar Histórico</button>
          <button type="button" class="btn btn-primary" id="bOkSR">Fechar</button>
        </div>
      `,
      onMount: (body) => {
        body.querySelector('#bOkSR').onclick = closeModal;
        body.querySelector('#bResetSR').onclick = async () => {
          const ok = await confirmDialog('Apagar TODOS os tempos (Recorde e Ouros) deste diagnóstico?', 'Sim, apagar', true);
          if(ok) {
            const rootToUpdate = await dbGet(srRootId);
            if (rootToUpdate) {
              delete rootToUpdate.speedrunRecord;
              delete rootToUpdate.bestSegments;
              delete rootToUpdate.pbRoute;
              await dbPut(rootToUpdate);
            }
            closeModal();
            toast('Histórico de Speedrun apagado com sucesso.');
          }
        };
      }
    });
  }
};

/* =======================================================================
   INÍCIO DO APP
======================================================================= */
render();

})();
</script>
</body>
</html>
